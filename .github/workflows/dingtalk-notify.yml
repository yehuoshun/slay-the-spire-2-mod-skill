on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: yehuoshun/yehuoshun-notify@main
        with:
          webhook: ${{ secrets.DINGTALK_WEBHOOK }}
